# Aapna Tiffin Nginx Configuration for EC2 (IP: 13.127.161.95)
# Place or symlink this in /etc/nginx/sites-available/aapna-tiffin
# and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 13.127.161.95;

    # Allow up to 10MB file uploads (profile photos, dishes, proofs)
    client_max_body_size 10M;

    # Frontend Static Bundle (built with Vite)
    location / {
        root /home/ubuntu/apnatiffin/client/dist;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads Reverse Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
